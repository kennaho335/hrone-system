<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRONE - 人力资源管理平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #5b6afa;
    --primary-light: #eef0ff;
    --primary-dark: #4453d4;
    --sidebar-bg: #fff;
    --active-blue: #e8f3ff;
    --active-gray: #f2f4f7;
    --tab-active-bg: #fff;
    --tab-bg: #f5f6fa;
    --border: #e8eaed;
    --text: #333;
    --text-secondary: #8a92a6;
    --text-light: #b0b8cc;
    --bg: #f5f6fa;
    --green: #52c41a;
    --orange: #fa8c16;
    --red: #ff4d4f;
    --blue: #2b7cd3;
    --dark-blue: #1a3a6e;
    --card-gap: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
    height: 100vh;
  }

  /* ===== Top Navigation Bar ===== */
  .top-nav {
    height: 48px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
    z-index: 100;
    flex-shrink: 0;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 1px;
  }
  .home-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: #5a6577;
    transition: background .2s;
  }
  .home-icon:hover { background: #f0f2f5; }
  .home-icon svg { width: 18px; height: 18px; }
  .all-menu-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: #5a6577;
    font-size: 13px;
    transition: background .2s;
  }
  .all-menu-btn:hover { background: #f0f2f5; }
  .all-menu-btn .grid-icon {
    width: 16px;
    height: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
  }
  .all-menu-btn .grid-icon span {
    border-radius: 2px;
  }
  .all-menu-btn .grid-icon span:nth-child(1) { background: #ff6b6b; }
  .all-menu-btn .grid-icon span:nth-child(2) { background: #4ecdc4; }
  .all-menu-btn .grid-icon span:nth-child(3) { background: #ffd93d; }
  .all-menu-btn .grid-icon span:nth-child(4) { background: #6c8ce0; }

  .nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: #5a6577;
    position: relative;
    transition: background .2s;
  }
  .nav-icon:hover { background: #f0f2f5; }
  .nav-icon svg { width: 18px; height: 18px; }
  .badge {
    position: absolute;
    top: 4px;
    right: 4px;
    min-width: 16px;
    height: 16px;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    font-weight: 600;
  }
  .nav-avatar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .2s;
  }
  .nav-avatar:hover { background: #f0f2f5; }
  .nav-avatar .avatar-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }
  .nav-avatar .user-name { font-size: 13px; color: #333; }

  /* ===== All Menu Dropdown — Full Page Overlay ===== */
  .all-menu-dropdown {
    position: fixed;
    top: 48px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    display: none;
    overflow-y: auto;
    padding: 24px;
  }
  .all-menu-dropdown.show { display: block; }
  .all-menu-content {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    min-height: calc(100vh - 48px - 48px);
  }
  .menu-category {
    margin-bottom: 8px;
  }
  .menu-category-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    padding: 6px 0;
    border-bottom: 1px solid #f0f2f5;
    margin-bottom: 4px;
  }
  .menu-category-title .cat-icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
  }
  .menu-sub-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 4px;
  }
  .menu-sub-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
    transition: background .15s;
    white-space: nowrap;
  }
  .menu-sub-item:hover { background: var(--primary-light); color: var(--primary); }
  .menu-sub-item .count { display: none; }

  /* ===== Main Layout ===== */
  .main-layout {
    display: flex;
    height: calc(100vh - 48px);
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 200px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: visible;
    flex-shrink: 0;
    padding: var(--card-gap) 0;
  }
  .sidebar-item { padding: 0; }

  /* Level-1 menu label (shared) */
  .sidebar-item > .menu-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    height: 36px;
    cursor: pointer;
    font-size: 13px;
    color: #333;
    transition: background .15s;
    user-select: none;
  }
  /* 首页 (leaf) — larger font, light blue on active/hover */
  .sidebar-item > .menu-label.leaf {
    font-size: 14px;
  }
  .sidebar-item > .menu-label.leaf:hover,
  .sidebar-item > .menu-label.leaf.active {
    background: var(--active-blue);
    color: var(--primary);
    font-weight: 600;
  }
  /* Parent level-1 — smaller font, indented, gray on active/hover */
  .sidebar-item > .menu-label.parent {
    padding-left: 44px;
    font-size: 12px;
  }
  .sidebar-item > .menu-label.parent:hover,
  .sidebar-item > .menu-label.parent.active {
    background: var(--active-gray);
  }
  .sidebar-item > .menu-label.parent.active {
    color: var(--primary);
    font-weight: 600;
  }
  /* Dots */
  .sidebar-item .menu-label .dot-l1 {
    width: 8px; height: 8px; border-radius: 50%;
    background: #5b6afa; flex-shrink: 0;
  }
  .sidebar-item .menu-label.leaf.active .dot-l1 { background: var(--primary); }
  .sidebar-item .menu-label.parent.active .dot-l1 { background: var(--primary); }
  /* Right area (count + arrow) */
  .sidebar-item .menu-label .menu-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-item .menu-label .menu-right .count { display: none; }
  .sidebar-item .menu-label .arrow {
    display: flex;
    align-items: center;
    transition: transform .2s;
    color: var(--text-light);
  }
  .sidebar-item .menu-label .arrow svg {
    width: 12px;
    height: 12px;
  }
  .sidebar-item.expanded .menu-label .arrow { transform: rotate(90deg); }

  /* Sub items */
  .sidebar-sub { display: none; }
  .sidebar-item.expanded .sidebar-sub { display: block; }
  .sidebar-sub-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 0 52px;
    height: 34px;
    cursor: pointer;
    font-size: 13px;
    color: #666;
    transition: all .15s;
    user-select: none;
  }
  .sidebar-sub-item .dot-l2 {
    width: 5px; height: 5px; border-radius: 50%;
    background: #c0c8d8; flex-shrink: 0;
  }
  /* Sub items — light blue on active/hover */
  .sidebar-sub-item:hover,
  .sidebar-sub-item.active {
    background: var(--active-blue);
    color: var(--primary);
    font-weight: 600;
  }
  .sidebar-sub-item.active .dot-l2 { background: var(--primary); }
  .sidebar-sub-item .count { display: none; }
  .sidebar-sub-item .new-tag {
    background: var(--red);
    color: #fff;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 8px;
    font-weight: 600;
    margin-left: 4px;
  }

  /* ===== Tab Bar ===== */
  .tab-bar {
    display: flex;
    align-items: stretch;
    background: #fff;
    border-radius: 6px;
    height: 34px;
    flex-shrink: 0;
    overflow: visible;
  }
  .tab-bar-scroll {
    display: flex;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tab-bar-scroll::-webkit-scrollbar { height: 0; }
  .tab-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    cursor: pointer;
    font-size: 12px;
    color: #666;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    transition: all .15s;
    user-select: none;
    position: relative;
  }
  .tab-item:hover { background: #f5f6fa; }
  .tab-item.active {
    background: var(--tab-active-bg);
    color: var(--primary);
    font-weight: 600;
    border-bottom: 2px solid var(--primary);
  }
  .tab-item .tab-close {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    font-size: 12px;
    color: var(--text-light);
    transition: all .15s;
  }
  .tab-item .tab-close:hover { background: #ddd; color: #333; }
  .tab-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    cursor: pointer;
    color: var(--text-secondary);
    flex-shrink: 0;
    position: relative;
  }
  .tab-arrow:hover { background: #f5f6fa; }
  .tab-arrow svg { width: 14px; height: 14px; }

  /* Tab dropdown */
  .tab-dropdown {
    position: absolute;
    top: 34px;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: none;
    z-index: 500;
    overflow: hidden;
  }
  .tab-dropdown.show { display: block; }
  .tab-dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    color: #444;
    transition: background .15s;
    white-space: nowrap;
  }
  .tab-dropdown-item:hover { background: #f5f6fa; }
  .tab-dropdown-item svg { width: 14px; height: 14px; color: var(--text-secondary); }

  /* ===== Content Area ===== */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: visible;
    padding: var(--card-gap);
    gap: var(--card-gap);
    background: var(--bg);
    min-height: 0;
    min-width: 0;
  }
  .content-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    position: relative;
    min-height: 0;
  }
  .tab-content {
    display: none;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .tab-content.active { display: block; }

  /* ===== Workbench (图3) ===== */
  .workbench {
    padding: var(--card-gap);
    display: flex;
    gap: var(--card-gap);
    height: 100%;
  }
  .wb-left, .wb-right {
    background: #fff;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .wb-left { flex: 1.4; }
  .wb-right { flex: 1; }
  .wb-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #e8eaed;
  }
  .wb-header .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }
  .wb-header .title .count-badge {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .wb-header .link {
    margin-left: auto;
    font-size: 12px;
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .wb-header .link:hover { text-decoration: underline; }
  .wb-filters {
    display: flex;
    gap: 2px;
    padding: 8px 16px;
    flex-wrap: wrap;
  }
  .wb-filter {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    transition: all .15s;
  }
  .wb-filter:hover { background: #f0f2f5; }
  .wb-filter.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .wb-list {
    flex: 1;
    overflow-y: auto;
  }
  .wb-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  .wb-list-item:hover { background: #fafbff; }
  .wb-list-item .item-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }
  .wb-list-item .item-content { flex: 1; min-width: 0; }
  .wb-list-item .item-title {
    font-size: 10px;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }
  .wb-list-item .item-time {
    font-size: 9px;
    color: var(--text-light);
  }
  .wb-list-item .item-action {
    padding: 3px 10px;
    border-radius: 4px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    transition: all .15s;
  }
  .wb-list-item .item-action:hover { background: var(--primary); color: #fff; }

  /* Notification items */
  .notif-item {
    padding: 12px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  .notif-item:hover { background: #fafbff; }
  .notif-item .notif-tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 3px;
    font-size: 9px;
    margin-bottom: 5px;
  }
  .notif-item .notif-tag.blue { background: #e6f4ff; color: #1677ff; }
  .notif-item .notif-title { font-size: 10px; color: #333; margin-bottom: 3px; line-height: 1.5; }
  .notif-item .notif-time { font-size: 9px; color: var(--text-light); }

  /* ===== Org Adjustment Apply Page (New: 调动流程风格) ===== */
  .org-apply-list-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
  }
  .org-apply-list-tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: #fff;
  }
  .org-apply-list-tab {
    height: 32px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: #666;
    border-bottom: 2px solid transparent;
    transition: all .15s;
    user-select: none;
  }
  .org-apply-list-tab:hover { color: var(--primary); }
  .org-apply-list-tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); background: #f8f9ff; }
  .org-apply-list-query {
    padding: 10px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .org-apply-list-query .query-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .org-apply-list-query .query-field.full-row {
    grid-column: 1 / -1;
  }
  .org-apply-list-query .query-field label {
    font-size: 12px;
    color: #666;
    white-space: nowrap;
  }
  .org-apply-list-query .query-field input,
  .org-apply-list-query .query-field select {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    outline: none;
    background: #fff;
    color: #333;
    transition: border-color .2s;
  }
  .org-apply-list-query .query-field input:focus,
  .org-apply-list-query .query-field select:focus { border-color: var(--primary); }
  .org-apply-list-query .query-field .date-range {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .org-apply-list-query .query-field .date-range input {
    flex: 1;
  }
  .org-apply-list-query .query-field .date-range span {
    color: var(--text-light);
    font-size: 12px;
  }
  .org-apply-list-query-btns {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .org-apply-list-query-btns .btn-query {
    padding: 6px 20px;
    border: none;
    border-radius: 4px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background .15s;
  }
  .org-apply-list-query-btns .btn-query:hover { background: var(--primary-dark); }
  .org-apply-list-query-btns .btn-query svg { width: 14px; height: 14px; }
  .org-apply-list-query-btns .btn-reset {
    padding: 6px 20px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: #666;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all .15s;
  }
  .org-apply-list-query-btns .btn-reset:hover { border-color: var(--primary); color: var(--primary); }
  .org-apply-list-query-btns .btn-reset svg { width: 14px; height: 14px; }
  .org-apply-list-toolbar {
    display: flex;
    justify-content: flex-end;
    padding: 8px 20px 0;
    flex-shrink: 0;
  }
  .org-apply-list-toolbar .btn-add {
    padding: 7px 18px;
    border: none;
    border-radius: 4px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .15s;
  }
  .org-apply-list-toolbar .btn-add:hover { background: var(--primary-dark); }
  .org-apply-list-toolbar .btn-add svg { width: 14px; height: 14px; }
  .org-apply-list-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .org-apply-list-table thead th { background: #f7f8fc; color: #666; font-weight: 500; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 10; }
  .org-apply-list-table thead th:not(:last-child)::after { content: " | "; color: #d0d5dd; margin-left: 8px; font-weight: 100; }
  .org-apply-list-table tbody td { padding: 8px 10px; color: #333; white-space: nowrap; }
  .org-apply-list-table tbody tr:nth-child(odd) { background: #fff; }
  .org-apply-list-table tbody tr:nth-child(even) { background: #f7f8fc; }
  .org-apply-list-table tbody tr:hover { background: #e8f3ff; }
  .org-apply-list-table .link-title { color: var(--primary); cursor: pointer; }
  .org-apply-list-table .link-title:hover { text-decoration: underline; }
  .org-apply-list-table .col-seq { position: sticky; left: 0; z-index: 5; background: inherit; border-right: 1px solid #e8eaed; }
  .org-apply-list-table .col-title { position: sticky; left: 50px; z-index: 5; background: inherit; }
  .org-apply-list-table .col-name { position: sticky; left: 200px; z-index: 5; background: inherit; }
  .org-apply-list-table .col-empno { position: sticky; left: 330px; z-index: 5; background: inherit; }
  .org-apply-list-table thead th.col-seq { z-index: 15; }
  .org-apply-list-table thead th.col-title { z-index: 15; }
  .org-apply-list-table thead th.col-name { z-index: 15; }
  .org-apply-list-table thead th.col-empno { z-index: 15; }

          <div class="menu-sub-item" onclick="addMenuFromAllMenu('${cat.name}', '${sub.name}')">
            <span>${sub.name}</span>
            <span class="count">${sub.count}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");

}

// ===== Render Sidebar =====
function renderSidebar() {
  const el = document.getElementById("sidebar");
  const sidebarData = sidebarModules[currentSidebarModule] || [];
  el.innerHTML = sidebarData.map((item, idx) => {
    if (item.isLeaf) {
      return `
        <div class="sidebar-item">
          <div class="menu-label leaf ${idx === 0 ? 'active' : ''}" onclick="sidebarItemClick('${item.name}', ${idx})">
            <span class="dot-l1"></span>
            <span>${item.name}</span>
            <div class="menu-right">
              ${item.count > 0 ? `<span class="count">${item.count}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }
    const expanded = item.expanded ? 'expanded' : '';
    return `
      <div class="sidebar-item ${expanded}" id="sidebar-item-${idx}">
        <div class="menu-label parent" onclick="toggleSidebar(${idx})">
          <span class="dot-l1"></span>
          <span>${item.name}</span>
          <div class="menu-right">
            ${item.count > 0 ? `<span class="count">${item.count}</span>` : ''}
            <span class="arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 6 15 12 9 18"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="sidebar-sub">
          ${item.children.map(child => `
            <div class="sidebar-sub-item" onclick="sidebarSubClick('${child.name}')">
              <span class="dot-l2"></span>
              <span>${child.name}</span>
              ${child.isNew ? '<span class="new-tag">NEW</span>' : ''}
              ${child.count > 0 ? `<span class="count">${child.count}</span>` : ''}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function toggleSidebar(idx) {
  const el = document.getElementById(`sidebar-item-${idx}`);
  if (el) el.classList.toggle("expanded");
  // Clear other active states, set this parent active
  document.querySelectorAll(".sidebar-item .menu-label").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".sidebar-sub-item").forEach(e => e.classList.remove("active"));
  const labelEl = el ? el.querySelector(".menu-label") : null;
  if (labelEl) labelEl.classList.add("active");
  // 若无子菜单，则打开占位 Tab
  const sidebarData = sidebarModules[currentSidebarModule] || [];
  const item = sidebarData[idx];
  if (item && (!item.children || item.children.length === 0)) {
    openOrSwitchTab(item.name, "placeholder");
  }
}

function sidebarItemClick(name, idx) {
  document.querySelectorAll(".sidebar-item .menu-label").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".sidebar-sub-item").forEach(e => e.classList.remove("active"));
  event.currentTarget.classList.add("active");
  // 首页 or 工作台 leaf → show workbench
  if (name === "首页" || name === "工作台") {
    // Switch to 工作台 module if not already
    if (currentSidebarModule !== "工作台") {
      currentSidebarModule = "工作台";
      renderSidebar();
    }
    activeTabId = "workbench";
    renderTabs();
    renderContent();
    return;
  }
  openOrSwitchTab(name, "placeholder");
}

function sidebarSubClick(name) {
  document.querySelectorAll(".sidebar-item .menu-label").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".sidebar-sub-item").forEach(e => e.classList.remove("active"));
  event.currentTarget.classList.add("active");
  // 组织架构调整申请 → org-apply page（参考截图：调动流程风格）
  // 组织调整方案 → 内容待开发，与其他页面一致
  // 其它子菜单 → placeholder
  let tabType = "placeholder";
  if (name === "组织架构调整申请") tabType = "org-apply";
  else if (name === "人事申请") tabType = "personnel-apply";
  else if (name === "团队档案") tabType = "team-profile";
  else if (name === "晋升见习转正") tabType = "trial-period-process";
  else if (name === "转正") tabType = "trial-period-process";
  openOrSwitchTab(name, tabType);
}

function addMenuFromAllMenu(catName, subName) {
  document.getElementById("allMenuDropdown").classList.remove("show");
  // Map all menu category to sidebar module
  const moduleMap = {
    "工作台": "工作台",
    "组织编制管理": "组织管理",
    "人事管理": "人事管理",
  };
  const sidebarModule = moduleMap[catName];
  if (sidebarModule && sidebarModules[sidebarModule]) {
    currentSidebarModule = sidebarModule;
    renderSidebar();
  }
  // 首页 → show workbench
  if (subName === "首页" || subName === "工作台") {
    activeTabId = "workbench";
    renderTabs();
    renderContent();
    return;
  }
  // 组织管理 → just switch sidebar, don't open tab (sidebar already expanded showing 组织架构调整申请)
  if (subName === "组织管理") {
    return;
  }
  // 任职管理 → just switch sidebar to 人事管理 module, don't open tab
  if (subName === "任职管理") {
    return;
  }
  // 组织架构调整申请 → org-apply page
  let tabType = "placeholder";
  if (subName === "组织架构调整申请") tabType = "org-apply";
  openOrSwitchTab(subName, tabType);
}

// ===== Tab Management =====
function openOrSwitchTab(name, type) {
  const tabId = `tab-${type}`;
  const existing = openTabs.find(t => t.id === tabId);
  if (existing) {
    activeTabId = tabId;
  } else {
    openTabs.push({ id: tabId, name, type, closable: true });
    activeTabId = tabId;
  }
  renderTabs();
  renderContent();
}

function closeTab(tabId) {
  if (!openTabs.find(t => t.id === tabId)?.closable) return;
  const idx = openTabs.findIndex(t => t.id === tabId);
  openTabs.splice(idx, 1);
  if (activeTabId === tabId) {
    activeTabId = openTabs[Math.max(0, idx - 1)].id;
    // If falling back to workbench, switch sidebar to 工作台 module
    if (activeTabId === "workbench" && currentSidebarModule !== "工作台") {
      currentSidebarModule = "工作台";
      renderSidebar();
    }
  }
  renderTabs();
  renderContent();
}

function closeOthers() {
  openTabs = openTabs.filter(t => !t.closable || t.id === activeTabId);
  // If active tab is workbench, switch sidebar back to 工作台 module
  if (activeTabId === "workbench" && currentSidebarModule !== "工作台") {
    currentSidebarModule = "工作台";
    renderSidebar();
  }
  renderTabs();
  renderContent();
  hideTabDropdown();
}

function closeAll() {
  openTabs = openTabs.filter(t => !t.closable);
  activeTabId = openTabs[0].id;
  // Switch sidebar back to 工作台 module
  if (currentSidebarModule !== "工作台") {
    currentSidebarModule = "工作台";
    renderSidebar();
  }
  renderTabs();
  renderContent();
  hideTabDropdown();
}

function switchTab(tabId) {
  activeTabId = tabId;
  renderTabs();
  renderContent();
}

function renderTabs() {
  const tabsHTML = openTabs.map(tab => `
    <div class="tab-item ${tab.id === activeTabId ? 'active' : ''}" onclick="switchTab('${tab.id}')">
      <span>${tab.name}</span>
      ${tab.closable ? `<span class="tab-close" onclick="event.stopPropagation();closeTab('${tab.id}')">✕</span>` : ''}
    </div>
  `).join("");
  const arrowHTML = `
    <div class="tab-arrow" onclick="toggleTabDropdown(event)" id="tabArrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <div class="tab-dropdown" id="tabDropdown">
        <div class="tab-dropdown-item" onclick="closeOthers()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
          关闭其它
        </div>
        <div class="tab-dropdown-item" onclick="closeAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
          </svg>
          关闭全部
        </div>
      </div>
    </div>
  `;
  document.getElementById("tabBar").innerHTML = `<div class="tab-bar-scroll">${tabsHTML}</div>${arrowHTML}`;
}

function toggleTabDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById("tabDropdown");
  dd.classList.toggle("show");
}

function hideTabDropdown() {
  const dd = document.getElementById("tabDropdown");
  if (dd) dd.classList.remove("show");
}

// ===== Content Rendering =====
function renderContent() {
  const el = document.getElementById("contentArea");
  el.innerHTML = openTabs.map(tab => {
    let inner = "";
    if (tab.type === "workbench") inner = renderWorkbench();
    else if (tab.type === "org-plan") inner = renderOrgAdjustmentPlan();
    else if (tab.type === "org-apply") inner = renderOrgAdjustmentApply();
    else if (tab.type === "initiate-process") inner = renderInitiateProcess();
    else if (tab.type === "personnel-apply") inner = renderPersonnelApply();
    else if (tab.type === "team-profile") inner = renderTeamProfile();
    else if (tab.type === "promotion-probation") inner = renderPromotionProbation();
    else if (tab.type === "promotion-form") inner = renderPromotionProbationForm();
    else if (tab.type === "personnel-promotion-form") inner = renderPersonnelPromotionForm();
    else if (tab.type === "appointment-promotion-form") inner = renderAppointmentPromotionForm();
    else if (tab.type === "trial-period-process") inner = renderTrialPeriodProcess();
    else inner = renderPlaceholder(tab.name);
    return `<div class="tab-content ${tab.id === activeTabId ? 'active' : ''}" id="content-${tab.id}">${inner}</div>`;
  }).join("");
}

function startTpColResize(e, colIndex) {
  e.preventDefault();
  e.stopPropagation();
  var table = document.querySelector('.tp-table');
  if (!table) return;
  var ths = table.querySelectorAll('th');
  var widths = [];
  for (var i = 0; i < ths.length; i++) widths.push(ths[i].offsetWidth);
  var startX = e.clientX;
  var origW = widths[colIndex];
  var handle = e.target;
  handle.classList.add('active');

  function onMove(ev) {
    var diff = ev.clientX - startX;
    var newW = Math.max(40, origW + diff);
    widths[colIndex] = newW;
    var th = ths[colIndex];
    th.style.width = newW + 'px';
    var cols = table.querySelectorAll('col');
    if (cols[colIndex]) cols[colIndex].style.width = newW + 'px';
    var total = widths.reduce(function(s, w) { return s + w; }, 0);
    table.style.width = total + 'px';
  }

  function onUp() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
}

function toggleTpCol(key) {
  var dd = document.querySelector('.tp-col-settings-dd');
  if (dd) {
    var item = dd.querySelector('[data-key="' + key + '"]');
    if (item) {
      var check = item.querySelector('.tp-col-dd-check');
      if (check) check.classList.toggle('checked');
    }
  }
  window.tpColSettingsChanged = true;
}

function applyTpColSettings() {
  var dd = document.querySelector('.tp-col-settings-dd');
  if (!dd) return;
  if (!window.tpColVisibility) window.tpColVisibility = {};
  var items = dd.querySelectorAll('.tp-col-dd-item');
  for (var i = 0; i < items.length; i++) {
    var key = items[i].getAttribute('data-key');
    var checked = items[i].querySelector('.tp-col-dd-check');
    window.tpColVisibility[key] = checked ? checked.classList.contains('checked') : false;
  }
  window.tpColSettingsChanged = false;
  renderContent();
}

function toggleSection(contentId, arrowId) {
  var content = document.getElementById(contentId);
  var arrow = document.getElementById(arrowId);
  if (!content || !arrow) return;
  var isHidden = content.style.display === 'none';
  if (isHidden) {
    content.style.display = content.getAttribute('data-orig-display') || '';
  } else {
    content.setAttribute('data-orig-display', content.style.display);
    content.style.display = 'none';
  }
  arrow.textContent = isHidden ? '▲' : '▶';
}

function startTppColResize(e, colIndex) {
  e.preventDefault(); e.stopPropagation();
  var table = document.querySelector('.tpp-table');
  if (!table) return;
  var ths = table.querySelectorAll('th');
  var widths = [];
  for (var i = 0; i < ths.length; i++) widths.push(ths[i].offsetWidth);
  var startX = e.clientX; var origW = widths[colIndex];
  var handle = e.target; handle.classList.add('active');
  function onMove(ev) {
    var diff = ev.clientX - startX;
    var newW = Math.max(40, origW + diff);
    widths[colIndex] = newW;
    ths[colIndex].style.width = newW + 'px';
    var cols = table.querySelectorAll('col');
    if (cols[colIndex]) cols[colIndex].style.width = newW + 'px';
    var total = widths.reduce(function(s, w) { return s + w; }, 0);
    table.style.width = total + 'px';
  }
  function onUp() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
}
function toggleTppCol(key) {
  var dd = document.querySelector('.tpp-col-settings-dd');
  if (dd) {
    var item = dd.querySelector('[data-key="' + key + '"]');
    if (item) {
      var check = item.querySelector('.tpp-col-dd-check');
      if (check) check.classList.toggle('checked');
    }
  }
  window.tppColSettingsChanged = true;
}
function applyTppColSettings() {
  if (!window.tppColVisibility) return;
  var dd = document.querySelector('.tpp-col-settings-dd');
  if (!dd) return;
  var items = dd.querySelectorAll('.tpp-col-dd-item');
  for (var i = 0; i < items.length; i++) {
    var key = items[i].getAttribute('data-key');
    var checked = items[i].querySelector('.tpp-col-dd-check');
    window.tppColVisibility[key] = checked ? checked.classList.contains('checked') : false;
  }
  window.tppColSettingsChanged = false;
  renderContent();
}

  '</div>';
}

// ===== Column visibility + resize =====
function toggleCol(key) {
  window.paVisibleCols[key] = !window.paVisibleCols[key];
}
function toggleColSettings(e) {
  e.stopPropagation();
  var dd = document.getElementById('colSettingsDropdown');
  if (!dd) return;
  var isShow = dd.style.display !== 'none';
  if (isShow) { dd.style.display = 'none'; renderContent(); }
  else {
    dd.style.display = 'block';
    var rect = e.currentTarget.getBoundingClientRect();
    dd.style.left = Math.min(rect.right - dd.offsetWidth, window.innerWidth - dd.offsetWidth - 10) + 'px';
    dd.style.top = (rect.bottom + 4) + 'px';
  }
}
document.addEventListener('click', function(e) {
  var dd = document.getElementById('colSettingsDropdown');
  if (dd && dd.style.display !== 'none') {
    if (!e.target.closest('#colSettingsDropdown') && !e.target.closest('[onclick*="toggleColSettings"]')) {
      dd.style.display = 'none'; renderContent();
    }
  }
});
var colResizeState = null;
function startColResize(e, key) {
  var th = e.currentTarget.closest('th');
  if (!th) return;
  colResizeState = { key: key, startX: e.clientX, startWidth: th.offsetWidth, th: th };
  document.addEventListener('mousemove', doColResize);
  document.addEventListener('mouseup', stopColResize);
  document.body.style.cursor = 'col-resize';
  e.preventDefault();
}
function doColResize(e) {
  if (!colResizeState) return;
  var diff = e.clientX - colResizeState.startX;
  var newWidth = colResizeState.startWidth + diff;
  if (newWidth < 40) newWidth = 40;
  window.paColWidths[colResizeState.key] = newWidth;
  renderContent();
}
function stopColResize() {
  colResizeState = null;
  document.removeEventListener('mousemove', doColResize);
  document.removeEventListener('mouseup', stopColResize);
  document.body.style.cursor = '';
}
function renderPlaceholder(name) {
  return `
    <div class="placeholder-page">
      <div class="ph-icon">🚧</div>
      <div class="ph-text">${name} — 内容待开发</div>
    </div>
  `;
}


function toggleMultiSelect(e, trigger) {
  e.stopPropagation();
  var dd = trigger.nextElementSibling;
  if (dd) dd.classList.toggle("show");
}
function updateMultiSelectTags(checkbox) {
  var container = checkbox.closest(".multi-select");
  var tags = container.querySelector(".multi-select-tags");
  var checked = container.querySelectorAll('.multi-select-option input:checked');
  tags.innerHTML = "";
  checked.forEach(function(cb) {
    var t = document.createElement("span");
    t.className = "multi-select-tag";
    t.dataset.val = cb.value;
    t.innerHTML = cb.value + ' <span class="tag-close">&times;</span>';
    t.querySelector(".tag-close").onclick = function(ev) {
      ev.stopPropagation();
      var v = t.dataset.val;
      container.querySelectorAll('.multi-select-option input').forEach(function(c) {
        if (c.value === v) c.checked = false;
      });
      updateMultiSelectTags(container.querySelector('.multi-select-option input'));
    };
    tags.appendChild(t);
  });
}
function toggleAdvancedFilter(link) {
  var fields = document.querySelectorAll(".advanced-field");
  var hidden = link.textContent === "显示高级筛选";
  fields.forEach(function(f) { f.classList.toggle("visible", hidden); });
  link.textContent = hidden ? "隐藏高级筛选" : "显示高级筛选";
}
document.addEventListener("click", function(e) {
  document.querySelectorAll(".multi-select-dropdown.show").forEach(function(dd) {
    if (!dd.closest(".multi-select").contains(e.target)) dd.classList.remove("show");
  });
});

// ===== Init =====
document.getElementById("allMenuBtn").addEventListener("click", function(e) {
  e.stopPropagation();
  document.getElementById("allMenuDropdown").classList.toggle("show");
});

document.addEventListener("click", function(e) {
  // Close all menu dropdown — click on overlay background or outside
  const dd = document.getElementById("allMenuDropdown");
  if (dd.classList.contains("show")) {
    if (e.target === dd || (!dd.contains(e.target) && !document.getElementById("allMenuBtn").contains(e.target))) {
      dd.classList.remove("show");
    }
  }
  // Close tab dropdown
  const td = document.getElementById("tabDropdown");
  const arrow = document.getElementById("tabArrow");
  if (td && arrow && !arrow.contains(e.target)) {
    td.classList.remove("show");
  }
});


// ===== Export settings modal =====
var tppExportFields = [
  {key:'seq',label:'序号'},
  {key:'title',label:'标题'},
  {key:'name',label:'申请人姓名'},
  {key:'empNo',label:'申请人工号'},
  {key:'dept',label:'部门全称'},
  {key:'probStartDate',label:'晋升见习开始日期'},
  {key:'probEndDate',label:'晋升见习结束日期'},
  {key:'applyTime',label:'申请时间'},
  {key:'status',label:'审批状态'}
];
var tppExportSelected = tppExportFields.map(function(f) { return f.key; });

function openExportSettings() {
  // Build modal HTML
  tppExportSelected = tppExportFields.map(function(f) { return f.key; });
  var leftFields = [];
  var rightFields = [];
  for (var i = 0; i < tppExportFields.length; i++) {
    var f = tppExportFields[i];
    if (tppExportSelected.indexOf(f.key) >= 0) {
      rightFields.push(f);
    } else {
      leftFields.push(f);
    }
  }
  var leftHtml = leftFields.map(function(f) {
    return '<div class="export-field-item" data-key="' + f.key + '" onclick="moveExportField(\'' + f.key + '\', \'right\')">' + f.label + '</div>';
  }).join('');
  var rightHtml = rightFields.map(function(f) {
    return '<div class="export-field-item" data-key="' + f.key + '" onclick="moveExportField(\'' + f.key + '\', \'left\')">' + f.label + '</div>';
  }).join('');

  var modal = document.getElementById('exportSettingsModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'exportSettingsModal';
    modal.className = 'export-modal-overlay';
    modal.onclick = function(e) { if (e.target === modal) closeExportSettings(); };
    document.body.appendChild(modal);
  }
  modal.innerHTML = 
    '<div class="export-modal">' +
      '<div class="export-modal-header">' +
        '<h3>导出字段设置</h3>' +
        '<button class="export-modal-close" onclick="closeExportSettings()">✕</button>' +
      '</div>' +
      '<div class="export-modal-body">' +
        '<div class="export-field-card">' +
          '<div class="export-field-card-header">未选项</div>' +
          '<div class="export-field-card-body" id="exportLeftCard">' + leftHtml + '</div>' +
        '</div>' +
        '<div class="export-arrows">' +
          '<button class="export-arrow-btn" onclick="moveAllExportFields(\'right\')" title="全部新增">≤</button>' +
          '<button class="export-arrow-btn" onclick="moveAllExportFields(\'left\')" title="全部移除">≥</button>' +
        '</div>' +
        '<div class="export-field-card">' +
          '<div class="export-field-card-header">已选项</div>' +
          '<div class="export-field-card-body" id="exportRightCard">' + rightHtml + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="export-modal-footer">' +
        '<button class="export-btn-cancel" onclick="closeExportSettings()">取消</button>' +
        '<button class="export-btn-confirm" onclick="confirmExportSettings()">确认</button>' +
      '</div>' +
    '</div>';
  modal.classList.add('show');
}

function closeExportSettings() {
  var modal = document.getElementById('exportSettingsModal');
  if (modal) modal.classList.remove('show');
}

function moveExportField(key, direction) {
  if (direction === 'right') {
    var idx = tppExportSelected.indexOf(key);
    if (idx < 0) tppExportSelected.push(key);
  } else {
    var idx = tppExportSelected.indexOf(key);
    if (idx >= 0) tppExportSelected.splice(idx, 1);
  }
  refreshExportCards();
}

function moveAllExportFields(direction) {
  if (direction === 'right') {
    tppExportSelected = tppExportFields.map(function(f) { return f.key; });
  } else {
    tppExportSelected = [];
  }
  refreshExportCards();
}

function refreshExportCards() {
  var leftFields = [];
  var rightFields = [];
  for (var i = 0; i < tppExportFields.length; i++) {
    var f = tppExportFields[i];
    if (tppExportSelected.indexOf(f.key) >= 0) {
      rightFields.push(f);
    } else {
      leftFields.push(f);
    }
  }
  var leftHtml = leftFields.map(function(f) {
    return '<div class="export-field-item" data-key="' + f.key + '" onclick="moveExportField(\'' + f.key + '\', \'right\')">' + f.label + '</div>';
  }).join('');
  var rightHtml = rightFields.map(function(f) {
    return '<div class="export-field-item" data-key="' + f.key + '" onclick="moveExportField(\'' + f.key + '\', \'left\')">' + f.label + '</div>';
  }).join('');
  var leftCard = document.getElementById('exportLeftCard');
  var rightCard = document.getElementById('exportRightCard');
  if (leftCard) leftCard.innerHTML = leftHtml;
  if (rightCard) rightCard.innerHTML = rightHtml;
}

function confirmExportSettings() {
  alert('导出设置已确认。已选择字段: ' + tppExportSelected.map(function(k) { var f = tppExportFields.find(function(x) { return x.key === k; }); return f ? f.label : k; }).join('、'));
  closeExportSettings();
}

// Render everything
renderAllMenuDropdown();
renderSidebar();
renderTabs();
renderContent();
</script>

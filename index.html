<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HRONE - 人力资源管理平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #5b6afa;
    --primary-light: #eef0ff;
    --primary-dark: #4453d4;
    --sidebar-bg: #fff;
    --active-blue: #e8f3ff;
    --active-gray: #f2f4f7;
    --tab-active-bg: #fff;
    --tab-bg: #f5f6fa;
    --border: #e8eaed;
    --text: #333;
    --text-secondary: #8a92a6;
    --text-light: #b0b8cc;
    --bg: #f5f6fa;
    --green: #52c41a;
    --orange: #fa8c16;
    --red: #ff4d4f;
    --blue: #2b7cd3;
    --dark-blue: #1a3a6e;
    --card-gap: 10px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
    height: 100vh;
  }

  /* ===== Top Navigation Bar ===== */
  .top-nav {
    height: 48px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    position: relative;
    z-index: 100;
    flex-shrink: 0;
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    letter-spacing: 1px;
  }
  .home-icon {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: #5a6577;
    transition: background .2s;
  }
  .home-icon:hover { background: #f0f2f5; }
  .home-icon svg { width: 18px; height: 18px; }
  .all-menu-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: #5a6577;
    font-size: 13px;
    transition: background .2s;
  }
  .all-menu-btn:hover { background: #f0f2f5; }
  .all-menu-btn .grid-icon {
    width: 16px;
    height: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
  }
  .all-menu-btn .grid-icon span {
    border-radius: 2px;
  }
  .all-menu-btn .grid-icon span:nth-child(1) { background: #ff6b6b; }
  .all-menu-btn .grid-icon span:nth-child(2) { background: #4ecdc4; }
  .all-menu-btn .grid-icon span:nth-child(3) { background: #ffd93d; }
  .all-menu-btn .grid-icon span:nth-child(4) { background: #6c8ce0; }

  .nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    cursor: pointer;
    color: #5a6577;
    position: relative;
    transition: background .2s;
  }
  .nav-icon:hover { background: #f0f2f5; }
  .nav-icon svg { width: 18px; height: 18px; }
  .badge {
    position: absolute;
    top: 4px;
    right: 4px;
    min-width: 16px;
    height: 16px;
    background: var(--red);
    color: #fff;
    font-size: 10px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    font-weight: 600;
  }
  .nav-avatar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .2s;
  }
  .nav-avatar:hover { background: #f0f2f5; }
  .nav-avatar .avatar-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }
  .nav-avatar .user-name { font-size: 13px; color: #333; }

  /* ===== All Menu Dropdown — Full Page Overlay ===== */
  .all-menu-dropdown {
    position: fixed;
    top: 48px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
    display: none;
    overflow-y: auto;
    padding: 24px;
  }
  .all-menu-dropdown.show { display: block; }
  .all-menu-content {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    min-height: calc(100vh - 48px - 48px);
  }
  .menu-category {
    margin-bottom: 8px;
  }
  .menu-category-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    padding: 6px 0;
    border-bottom: 1px solid #f0f2f5;
    margin-bottom: 4px;
  }
  .menu-category-title .cat-icon {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: #fff;
  }
  .menu-sub-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 4px;
  }
  .menu-sub-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #555;
    transition: background .15s;
    white-space: nowrap;
  }
  .menu-sub-item:hover { background: var(--primary-light); color: var(--primary); }
  .menu-sub-item .count { display: none; }

  /* ===== Main Layout ===== */
  .main-layout {
    display: flex;
    height: calc(100vh - 48px);
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: 200px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    overflow-x: visible;
    flex-shrink: 0;
    padding: var(--card-gap) 0;
  }
  .sidebar-item { padding: 0; }

  /* Level-1 menu label (shared) */
  .sidebar-item > .menu-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    height: 36px;
    cursor: pointer;
    font-size: 13px;
    color: #333;
    transition: background .15s;
    user-select: none;
  }
  /* 首页 (leaf) — larger font, light blue on active/hover */
  .sidebar-item > .menu-label.leaf {
    font-size: 14px;
  }
  .sidebar-item > .menu-label.leaf:hover,
  .sidebar-item > .menu-label.leaf.active {
    background: var(--active-blue);
    color: var(--primary);
    font-weight: 600;
  }
  /* Parent level-1 — smaller font, indented, gray on active/hover */
  .sidebar-item > .menu-label.parent {
    padding-left: 44px;
    font-size: 12px;
  }
  .sidebar-item > .menu-label.parent:hover,
  .sidebar-item > .menu-label.parent.active {
    background: var(--active-gray);
  }
  .sidebar-item > .menu-label.parent.active {
    color: var(--primary);
    font-weight: 600;
  }
  /* Dots */
  .sidebar-item .menu-label .dot-l1 {
    width: 8px; height: 8px; border-radius: 50%;
    background: #5b6afa; flex-shrink: 0;
  }
  .sidebar-item .menu-label.leaf.active .dot-l1 { background: var(--primary); }
  .sidebar-item .menu-label.parent.active .dot-l1 { background: var(--primary); }
  /* Right area (count + arrow) */
  .sidebar-item .menu-label .menu-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-item .menu-label .menu-right .count { display: none; }
  .sidebar-item .menu-label .arrow {
    display: flex;
    align-items: center;
    transition: transform .2s;
    color: var(--text-light);
  }
  .sidebar-item .menu-label .arrow svg {
    width: 12px;
    height: 12px;
  }
  .sidebar-item.expanded .menu-label .arrow { transform: rotate(90deg); }

  /* Sub items */
  .sidebar-sub { display: none; }
  .sidebar-item.expanded .sidebar-sub { display: block; }
  .sidebar-sub-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px 0 52px;
    height: 34px;
    cursor: pointer;
    font-size: 13px;
    color: #666;
    transition: all .15s;
    user-select: none;
  }
  .sidebar-sub-item .dot-l2 {
    width: 5px; height: 5px; border-radius: 50%;
    background: #c0c8d8; flex-shrink: 0;
  }
  /* Sub items — light blue on active/hover */
  .sidebar-sub-item:hover,
  .sidebar-sub-item.active {
    background: var(--active-blue);
    color: var(--primary);
    font-weight: 600;
  }
  .sidebar-sub-item.active .dot-l2 { background: var(--primary); }
  .sidebar-sub-item .count { display: none; }
  .sidebar-sub-item .new-tag {
    background: var(--red);
    color: #fff;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 8px;
    font-weight: 600;
    margin-left: 4px;
  }

  /* ===== Tab Bar ===== */
  .tab-bar {
    display: flex;
    align-items: stretch;
    background: #fff;
    border-radius: 6px;
    height: 34px;
    flex-shrink: 0;
    overflow: visible;
  }
  .tab-bar-scroll {
    display: flex;
    align-items: stretch;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .tab-bar-scroll::-webkit-scrollbar { height: 0; }
  .tab-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    cursor: pointer;
    font-size: 12px;
    color: #666;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    transition: all .15s;
    user-select: none;
    position: relative;
  }
  .tab-item:hover { background: #f5f6fa; }
  .tab-item.active {
    background: var(--tab-active-bg);
    color: var(--primary);
    font-weight: 600;
    border-bottom: 2px solid var(--primary);
  }
  .tab-item .tab-close {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px;
    font-size: 12px;
    color: var(--text-light);
    transition: all .15s;
  }
  .tab-item .tab-close:hover { background: #ddd; color: #333; }
  .tab-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    cursor: pointer;
    color: var(--text-secondary);
    flex-shrink: 0;
    position: relative;
  }
  .tab-arrow:hover { background: #f5f6fa; }
  .tab-arrow svg { width: 14px; height: 14px; }

  /* Tab dropdown */
  .tab-dropdown {
    position: absolute;
    top: 34px;
    right: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    display: none;
    z-index: 500;
    overflow: hidden;
  }
  .tab-dropdown.show { display: block; }
  .tab-dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    color: #444;
    transition: background .15s;
    white-space: nowrap;
  }
  .tab-dropdown-item:hover { background: #f5f6fa; }
  .tab-dropdown-item svg { width: 14px; height: 14px; color: var(--text-secondary); }

  /* ===== Content Area ===== */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: visible;
    padding: var(--card-gap);
    gap: var(--card-gap);
    background: var(--bg);
    min-height: 0;
    min-width: 0;
  }
  .content-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg);
    position: relative;
    min-height: 0;
  }
  .tab-content {
    display: none;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .tab-content.active { display: block; }

  /* ===== Workbench (图3) ===== */
  .workbench {
    padding: var(--card-gap);
    display: flex;
    gap: var(--card-gap);
    height: 100%;
  }
  .wb-left, .wb-right {
    background: #fff;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .wb-left { flex: 1.4; }
  .wb-right { flex: 1; }
  .wb-header {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #e8eaed;
  }
  .wb-header .title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    color: #333;
  }
  .wb-header .title .count-badge {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .wb-header .link {
    margin-left: auto;
    font-size: 12px;
    color: var(--primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .wb-header .link:hover { text-decoration: underline; }
  .wb-filters {
    display: flex;
    gap: 2px;
    padding: 8px 16px;
    flex-wrap: wrap;
  }
  .wb-filter {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 11px;
    color: #666;
    cursor: pointer;
    transition: all .15s;
  }
  .wb-filter:hover { background: #f0f2f5; }
  .wb-filter.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .wb-list {
    flex: 1;
    overflow-y: auto;
  }
  .wb-list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  .wb-list-item:hover { background: #fafbff; }
  .wb-list-item .item-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }
  .wb-list-item .item-content { flex: 1; min-width: 0; }
  .wb-list-item .item-title {
    font-size: 10px;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 3px;
  }
  .wb-list-item .item-time {
    font-size: 9px;
    color: var(--text-light);
  }
  .wb-list-item .item-action {
    padding: 3px 10px;
    border-radius: 4px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    transition: all .15s;
  }
  .wb-list-item .item-action:hover { background: var(--primary); color: #fff; }

  /* Notification items */
  .notif-item {
    padding: 12px 16px;
    cursor: pointer;
    transition: background .15s;
  }
  .notif-item:hover { background: #fafbff; }
  .notif-item .notif-tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 3px;
    font-size: 9px;
    margin-bottom: 5px;
  }
  .notif-item .notif-tag.blue { background: #e6f4ff; color: #1677ff; }
  .notif-item .notif-title { font-size: 10px; color: #333; margin-bottom: 3px; line-height: 1.5; }
  .notif-item .notif-time { font-size: 9px; color: var(--text-light); }

  /* ===== Org Adjustment Apply Page (New: 调动流程风格) ===== */
  .org-apply-list-page {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
  }
  .org-apply-list-tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px 0;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: #fff;
  }
  .org-apply-list-tab {
    height: 32px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-radius: 6px 6px 0 0;
    cursor: pointer;
    font-size: 13px;
    color: #666;
    border-bottom: 2px solid transparent;
    transition: all .15s;
    user-select: none;
  }
  .org-apply-list-tab:hover { color: var(--primary); }
  .org-apply-list-tab.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); background: #f8f9ff; }
  .org-apply-list-query {
    padding: 10px 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .org-apply-list-query .query-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .org-apply-list-query .query-field.full-row {
    grid-column: 1 / -1;
  }
  .org-apply-list-query .query-field label {
    font-size: 12px;
    color: #666;
    white-space: nowrap;
  }
  .org-apply-list-query .query-field input,
  .org-apply-list-query .query-field select {
    width: 100%;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    outline: none;
    background: #fff;
    color: #333;
    transition: border-color .2s;
  }
  .org-apply-list-query .query-field input:focus,
  .org-apply-list-query .query-field select:focus { border-color: var(--primary); }
  .org-apply-list-query .query-field .date-range {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .org-apply-list-query .query-field .date-range input {
    flex: 1;
  }
  .org-apply-list-query .query-field .date-range span {
    color: var(--text-light);
    font-size: 12px;
  }
  .org-apply-list-query-btns {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .org-apply-list-query-btns .btn-query {
    padding: 6px 20px;
    border: none;
    border-radius: 4px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background .15s;
  }
  .org-apply-list-query-btns .btn-query:hover { background: var(--primary-dark); }
  .org-apply-list-query-btns .btn-query svg { width: 14px; height: 14px; }
  .org-apply-list-query-btns .btn-reset {
    padding: 6px 20px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: #666;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all .15s;
  }
  .org-apply-list-query-btns .btn-reset:hover { border-color: var(--primary); color: var(--primary); }
  .org-apply-list-query-btns .btn-reset svg { width: 14px; height: 14px; }
  .org-apply-list-toolbar {
    display: flex;
    justify-content: flex-end;
    padding: 8px 20px 0;
    flex-shrink: 0;
  }
  .org-apply-list-toolbar .btn-add {
    padding: 7px 18px;
    border: none;
    border-radius: 4px;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background .15s;
  }
  .org-apply-list-toolbar .btn-add:hover { background: var(--primary-dark); }
  .org-apply-list-toolbar .btn-add svg { width: 14px; height: 14px; }
  .org-apply-list-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  .org-apply-list-table thead th { background: #f7f8fc; color: #666; font-weight: 500; padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 10; }
  .org-apply-list-table thead th:not(:last-child)::after { content: " | "; color: #d0d5dd; margin-left: 8px; font-weight: 100; }
  .org-apply-list-table tbody td { padding: 8px 10px; color: #333; white-space: nowrap; }
  .org-apply-list-table tbody tr:nth-child(odd) { background: #fff; }
  .org-apply-list-table tbody tr:nth-child(even) { background: #f7f8fc; }
  .org-apply-list-table tbody tr:hover { background: #e8f3ff; }
  .org-apply-list-table .link-title { color: var(--primary); cursor: pointer; }
  .org-apply-list-table .link-title:hover { text-decoration: underline; }
  .org-apply-list-table .col-seq { position: sticky; left: 0; z-index: 5; background: inherit; border-right: 1px solid #e8eaed; }
  .org-apply-list-table .col-title { position: sticky; left: 50px; z-index: 5; background: inherit; }
  .org-apply-list-table .col-name { position: sticky; left: 200px; z-index: 5; background: inherit; }
  .org-apply-list-table .col-empno { position: sticky; left: 330px; z-index: 5; background: inherit; }
  .org-apply-list-table thead th.col-seq { z-index: 15; }
  .org-apply-list-table thead th.col-title { z-index: 15; }
  .org-apply-list-table thead th.col-name { z-index: 15; }
  .org-apply-list-table thead th.col-empno { z-index: 15; }

          <div class="menu-sub-item" onclick="addMenuFromAllMenu('${cat.name}', '${sub.name}')">
            <span>${sub.name}</span>
            <span class="count">${sub.count}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
  el.innerHTML = `<div class="all-menu-content" onclick="event.stopPropagation()">${inner}</div>`;
}

// ===== Render Sidebar =====
function renderSidebar() {
  const el = document.getElementById("sidebar");
  const sidebarData = sidebarModules[currentSidebarModule] || [];
  el.innerHTML = sidebarData.map((item, idx) => {
    if (item.isLeaf) {
      return `
        <div class="sidebar-item">
          <div class="menu-label leaf ${idx === 0 ? 'active' : ''}" onclick="sidebarItemClick('${item.name}', ${idx})">
            <span class="dot-l1"></span>
            <span>${item.name}</span>
            <div class="menu-right">
              ${item.count > 0 ? `<span class="count">${item.count}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }
    const expanded = item.expanded ? 'expanded' : '';
    return `
      <div class="sidebar-item ${expanded}" id="sidebar-item-${idx}">
        <div class="menu-label parent" onclick="toggleSidebar(${idx})">
          <span class="dot-l1"></span>
          <span>${item.name}</span>
          <div class="menu-right">
            ${item.count > 0 ? `<span class="count">${item.count}</span>` : ''}
            <span class="arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 6 15 12 9 18"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="sidebar-sub">
          ${item.children.map(child => `
            <div class="sidebar-sub-item" onclick="sidebarSubClick('${child.name}')">
              <span class="dot-l2"></span>
              <span>${child.name}</span>
              ${child.isNew ? '<span class="new-tag">NEW</span>' : ''}
              ${child.count > 0 ? `<span class="count">${child.count}</span>` : ''}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }).join("");
}

function toggleSidebar(idx) {
  const el = document.getElementById(`sidebar-item-${idx}`);
  if (el) el.classList.toggle("expanded");
  // Clear other active states, set this parent active
  document.querySelectorAll(".sidebar-item .menu-label").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".sidebar-sub-item").forEach(e => e.classList.remove("active"));
  const labelEl = el ? el.querySelector(".menu-label") : null;
  if (labelEl) labelEl.classList.add("active");
  // 若无子菜单，则打开占位 Tab
  const sidebarData = sidebarModules[currentSidebarModule] || [];
  const item = sidebarData[idx];
  if (item && (!item.children || item.children.length === 0)) {
    openOrSwitchTab(item.name, "placeholder");
  }
}

function sidebarItemClick(name, idx) {
  document.querySelectorAll(".sidebar-item .menu-label").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".sidebar-sub-item").forEach(e => e.classList.remove("active"));
  event.currentTarget.classList.add("active");
  // 首页 or 工作台 leaf → show workbench
  if (name === "首页" || name === "工作台") {
    // Switch to 工作台 module if not already
    if (currentSidebarModule !== "工作台") {
      currentSidebarModule = "工作台";
      renderSidebar();
    }
    activeTabId = "workbench";
    renderTabs();
    renderContent();
    return;
  }
  openOrSwitchTab(name, "placeholder");
}

function sidebarSubClick(name) {
  document.querySelectorAll(".sidebar-item .menu-label").forEach(e => e.classList.remove("active"));
  document.querySelectorAll(".sidebar-sub-item").forEach(e => e.classList.remove("active"));
  event.currentTarget.classList.add("active");
  // 组织架构调整申请 → org-apply page（参考截图：调动流程风格）
  // 组织调整方案 → 内容待开发，与其他页面一致
  // 其它子菜单 → placeholder
  let tabType = "placeholder";
  if (name === "组织架构调整申请") tabType = "org-apply";
  else if (name === "人事申请") tabType = "personnel-apply";
  else if (name === "团队档案") tabType = "team-profile";
  else if (name === "晋升见习转正") tabType = "trial-period-process";
  else if (name === "转正") tabType = "trial-period-process";
  openOrSwitchTab(name, tabType);
}

function addMenuFromAllMenu(catName, subName) {
  document.getElementById("allMenuDropdown").classList.remove("show");
  // Map all menu category to sidebar module
  const moduleMap = {
    "工作台": "工作台",
    "组织编制管理": "组织管理",
    "人事管理": "人事管理",
  };
  const sidebarModule = moduleMap[catName];
  if (sidebarModule && sidebarModules[sidebarModule]) {
    currentSidebarModule = sidebarModule;
    renderSidebar();
  }
  // 首页 → show workbench
  if (subName === "首页" || subName === "工作台") {
    activeTabId = "workbench";
    renderTabs();
    renderContent();
    return;
  }
  // 组织管理 → just switch sidebar, don't open tab (sidebar already expanded showing 组织架构调整申请)
  if (subName === "组织管理") {
    return;
  }
  // 任职管理 → just switch sidebar to 人事管理 module, don't open tab
  if (subName === "任职管理") {
    return;
  }
  // 组织架构调整申请 → org-apply page
  let tabType = "placeholder";
  if (subName === "组织架构调整申请") tabType = "org-apply";
  openOrSwitchTab(subName, tabType);
}

// ===== Tab Management =====


function closeTab(tabId) {
  if (!openTabs.find(t => t.id === tabId)?.closable) return;
  const idx = openTabs.findIndex(t => t.id === tabId);
  openTabs.splice(idx, 1);
  if (activeTabId === tabId) {
    activeTabId = openTabs[Math.max(0, idx - 1)].id;
    // If falling back to workbench, switch sidebar to 工作台 module
    if (activeTabId === "workbench" && currentSidebarModule !== "工作台") {
      currentSidebarModule = "工作台";
      renderSidebar();
    }
  }
  renderTabs();
  renderContent();
}

function closeOthers() {
  openTabs = openTabs.filter(t => !t.closable || t.id === activeTabId);
  // If active tab is workbench, switch sidebar back to 工作台 module
  if (activeTabId === "workbench" && currentSidebarModule !== "工作台") {
    currentSidebarModule = "工作台";
    renderSidebar();
  }
  renderTabs();
  renderContent();
  hideTabDropdown();
}

function closeAll() {
  openTabs = openTabs.filter(t => !t.closable);
  activeTabId = openTabs[0].id;
  // Switch sidebar back to 工作台 module
  if (currentSidebarModule !== "工作台") {
    currentSidebarModule = "工作台";
    renderSidebar();
  }
  renderTabs();
  renderContent();
  hideTabDropdown();
}

function switchTab(tabId) {
  activeTabId = tabId;
  renderTabs();
  renderContent();
}

function renderTabs() {
  const tabsHTML = openTabs.map(tab => `
    <div class="tab-item ${tab.id === activeTabId ? 'active' : ''}" onclick="switchTab('${tab.id}')">
      <span>${tab.name}</span>
      ${tab.closable ? `<span class="tab-close" onclick="event.stopPropagation();closeTab('${tab.id}')">✕</span>` : ''}
    </div>
  `).join("");
  const arrowHTML = `
    <div class="tab-arrow" onclick="toggleTabDropdown(event)" id="tabArrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <div class="tab-dropdown" id="tabDropdown">
        <div class="tab-dropdown-item" onclick="closeOthers()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
          关闭其它
        </div>
        <div class="tab-dropdown-item" onclick="closeAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
          </svg>
          关闭全部
        </div>
      </div>
    </div>
  `;
  document.getElementById("tabBar").innerHTML = `<div class="tab-bar-scroll">${tabsHTML}</div>${arrowHTML}`;
}

function toggleTabDropdown(e) {
  e.stopPropagation();
  const dd = document.getElementById("tabDropdown");
  dd.classList.toggle("show");
}

function hideTabDropdown() {
  const dd = document.getElementById("tabDropdown");
  if (dd) dd.classList.remove("show");
}

function startTpColResize(e, colIndex) {
  e.preventDefault();
  e.stopPropagation();
  var table = document.querySelector('.tp-table');
  if (!table) return;
  var ths = table.querySelectorAll('th');
  var widths = [];
  for (var i = 0; i < ths.length; i++) widths.push(ths[i].offsetWidth);
  var startX = e.clientX;
  var origW = widths[colIndex];
  var handle = e.target;
  handle.classList.add('active');

  function onMove(ev) {
    var diff = ev.clientX - startX;
    var newW = Math.max(40, origW + diff);
    widths[colIndex] = newW;
    var th = ths[colIndex];
    th.style.width = newW + 'px';
    var cols = table.querySelectorAll('col');
    if (cols[colIndex]) cols[colIndex].style.width = newW + 'px';
    var total = widths.reduce(function(s, w) { return s + w; }, 0);
    table.style.width = total + 'px';
  }

  function onUp() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
}

function toggleTpCol(key) {
  var dd = document.querySelector('.tp-col-settings-dd');
  if (dd) {
    var item = dd.querySelector('[data-key="' + key + '"]');

function applyTpColSettings() {
  var dd = document.querySelector('.tp-col-settings-dd');
  if (!dd) return;

  var items = dd.querySelectorAll('.tp-col-dd-item');

    var key = items[i].getAttribute('data-key');
    var checked = items[i].querySelector('.tp-col-dd-check');
    window.tpColVisibility[key] = checked ? checked.classList.contains('checked') : false;
  }
  window.tpColSettingsChanged = false;
  renderContent();
}

function startTppColResize(e, colIndex) {
  e.preventDefault(); e.stopPropagation();
  var table = document.querySelector('.tpp-table');
  if (!table) return;
  var ths = table.querySelectorAll('th');
  var widths = [];
  for (var i = 0; i < ths.length; i++) widths.push(ths[i].offsetWidth);
  var startX = e.clientX; var origW = widths[colIndex];
  var handle = e.target; handle.classList.add('active');
  function onMove(ev) {
    var diff = ev.clientX - startX;
    var newW = Math.max(40, origW + diff);
    widths[colIndex] = newW;
    ths[colIndex].style.width = newW + 'px';
    var cols = table.querySelectorAll('col');
    if (cols[colIndex]) cols[colIndex].style.width = newW + 'px';
    var total = widths.reduce(function(s, w) { return s + w; }, 0);
    table.style.width = total + 'px';
  }
  function onUp() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
}
function toggleTppCol(key) {
  var dd = document.querySelector('.tpp-col-settings-dd');
  if (dd) {
    var item = dd.querySelector('[data-key="' + key + '"]');
    if (item) {
      var check = item.querySelector('.tpp-col-dd-check');
      if (check) check.classList.toggle('checked');

  window.tppColSettingsChanged = true;
}
function applyTppColSettings() {
  if (!window.tppColVisibility) return;
  var dd = document.querySelector('.tpp-col-settings-dd');
  if (!dd) return;
  var items = dd.querySelectorAll('.tpp-col-dd-item');
  for (var i = 0; i < items.length; i++) {
    var key = items[i].getAttribute('data-key');
    var checked = items[i].querySelector('.tpp-col-dd-check');
    window.tppColVisibility[key] = checked ? checked.classList.contains('checked') : false;
  }

}

var colResizeState = null;
function startColResize(e, key) {
  var th = e.currentTarget.closest('th');
  if (!th) return;
  colResizeState = { key: key, startX: e.clientX, startWidth: th.offsetWidth, th: th };
  document.addEventListener('mousemove', doColResize);
  document.addEventListener('mouseup', stopColResize);
  document.body.style.cursor = 'col-resize';
  e.preventDefault();
}
function doColResize(e) {
  if (!colResizeState) return;
  var diff = e.clientX - colResizeState.startX;
  var newWidth = colResizeState.startWidth + diff;
  if (newWidth < 40) newWidth = 40;
  window.paColWidths[colResizeState.key] = newWidth;
  renderContent();
}
function stopColResize() {
  colResizeState = null;
  document.removeEventListener('mousemove', doColResize);
  document.removeEventListener('mouseup', stopColResize);
  document.body.style.cursor = '';
}

  if (direction === 'right') {
    var idx = tppExportSelected.indexOf(key);

  } else {
    var idx = tppExportSelected.indexOf(key);
    if (idx >= 0) tppExportSelected.splice(idx, 1);

  refreshExportCards();
}

  if (direction === 'right') {
    tppExportSelected = tppExportFields.map(function(f) { return f.key; });

  refreshExportCards();
}

  var leftFields = [];

function promotionNormalizeDate(value) {
  if (!value) return '';
  return String(value).replace(/\//g, '-');
}
function promotionParseDate(value) {

  return new Date(p[0], p[1]-1, p[2] || 1);
}

function renderTrialPeriodProcess(){ var records=getPromotionProbationRecords(); var rows=records.map(function(r,i){ var op=r.status==='审批中'?oldUrgeButton(r.id):''; return '<tr><td class="col-seq">'+(i+1)+'</td><td><span class="link-title" onclick="openPromotionApplicationDetail(\''+r.id+'\')">'+r.title+'</span></td><td>'+r.employeeName+'</td><td>'+r.empNo+'</td><td>'+getPromotionDeptLowestLevel(r.dept)+'</td><td title="'+r.dept+'">'+r.dept+'</td><td>'+r.trialStart+'</td><td>'+r.expectedEnd+'</td><td>'+r.applyTime+'</td><td><span style="'+promotionStatusStyle(r.status)+'padding:2px 12px;border-radius:12px;font-size:12px;display:inline-block;">'+r.status+'</span></td><td>'+r.creator+'</td><td>'+r.creatorTime+'</td><td>'+(r.area||'--')+'</td><td>是</td><td class="col-op">'+op+'</td></tr>'; }).join(''); return '<div style="height:100%;display:flex;flex-direction:column;background:#f5f6fa;overflow:hidden;padding:0;">' +
  '<div class="tp-query" style="margin:0;"><div class="tp-query-fields"><div class="query-field"><label>员工</label><input id="tppEmp" placeholder="请通过工号/姓名搜索"></div><div class="query-field"><label>部门</label><input id="tppDept" placeholder="请选择" readonly></div><div class="query-field"><label>划分区域</label><input id="tppArea" placeholder="请选择" readonly></div><div class="query-field"><label>审批状态</label><select id="tppStatus"><option value="">请选择</option><option>审批中</option><option>通过</option><option>不通过</option><option>已作废</option><option>已驳回</option></select></div><div class="query-field"><label>创建人</label><input id="tppCreator" placeholder="请通过工号/姓名搜索"></div><div class="query-field"><label>创建时间</label><input id="tppDate" placeholder="开始时间 ~ 结束时间" readonly></div></div><div class="tp-query-btns"><button class="btn-query">查询</button><button class="btn-reset" onclick="document.getElementById(\'tppEmp\').value=\'\';document.getElementById(\'tppCreator\').value=\'\';document.getElementById(\'tppDate\').value=\'\';">重置</button></div></div>' +
  '<div style="height:16px;flex-shrink:0;"></div><div class="tp-table-wrap tpp-page" style="margin:0 0 -12px 0;"><div style="display:flex;justify-content:flex-end;padding:8px 20px 0;flex-shrink:0;"><button style="padding:6px 16px;border:none;border-radius:4px;background:var(--primary);color:#fff;font-size:13px;cursor:pointer;white-space:nowrap;" onclick="openOrSwitchTab(\'晋升见习转正申请\',\'appointment-promotion-form\')">晋升见习转正</button><button style="padding:6px 16px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#333;font-size:13px;cursor:pointer;white-space:nowrap;margin-left:8px;">导出</button><button style="padding:6px 16px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#333;font-size:13px;cursor:pointer;white-space:nowrap;margin-left:4px;" onclick="openExportSettings()">⚙️ 导出设置</button></div><div class="tp-table-scroll" style="padding:8px 0 8px 12px;"><table class="tp-table tpp-table" style="table-layout:fixed;width:1540px;"><thead><tr><th style="width:55px">序号</th><th style="width:200px">标题</th><th style="width:90px">员工</th><th style="width:100px">工号</th><th style="width:110px">部门</th><th style="width:120px">部门全称</th><th style="width:140px">晋升见习开始日期</th><th style="width:150px">晋升见习预计结束日期</th><th style="width:110px">申请时间</th><th style="width:90px">审批状态</th><th style="width:90px">创建人</th><th style="width:150px">创建时间</th><th style="width:90px">划分区域</th><th style="width:130px">是否有试用协议</th><th style="width:80px">操作</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="tp-pagination"><span>共'+records.length+'条</span><span class="page-btn">&lt;</span><span class="page-btn active">1</span><span class="page-btn">&gt;</span><select class="page-size"><option>20条/页</option></select><span class="jump-to">跳至<input type="text">页</span></div></div></div>'; }
function renderPromotionApplicationDetail(recordId){ return renderPromotionDetail(findPromotionRecord(recordId), false); }
function renderPromotionApprovalDetail(recordId){ return renderPromotionDetail(findPromotionRecord(recordId), true); }
function renderPromotionDetail(r, approval){
  function safe(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function findEmp(record) {
    var all = [];
    try { all = all.concat(promotionTeamEmployees || [], promotionPermissionEmployees || [], [promotionSelfEmployee]); } catch(e) {}
    return all.filter(function(e) { return e && e.empNo === record.empNo; })[0] || {};
  }
  var emp = findEmp(r);
  var employeeName = r.employeeName || r.name || emp.name || '';
  var empNo = r.empNo || emp.empNo || '';
  var dept = r.dept || emp.dept || '';
  var position = r.position || emp.position || '三级组织职位1';
  var rank = r.rank || emp.rank || 'M2-2';
  var entryDate = r.entryDate || r.hireDate || emp.entryDate || '2026/07/24';
  var startDate = r.trialStart || r.startDate || emp.startDate || '2026-07-01';
  var expectedEnd = r.expectedEnd || r.expectEndDate || emp.expectEndDate || '2026-09-24';
  var actualEnd = r.actualEnd || emp.actualEnd || '';
  var creator = r.creator || '黄东升';
  var creatorEmpNo = r.creatorEmpNo || 'WX21197';
  var applyDate = r.applyTime || (r.creatorTime ? String(r.creatorTime).slice(0, 10) : '2026-07-30');
  var approvalNo = 'P' + (String(r.id || '').replace(/\D/g,'').slice(-14) || '20260730170019').padStart(14, '0');
  var displayTitle = r.title || (employeeName + '的晋升见习转正申请');
  function roInput(value) {
    return '<input value="' + safe(value) + '" readonly style="width:100%;height:34px;border:1px solid #e5e7eb;border-radius:4px;background:#f8f9fb;color:#303133;padding:0 10px;font-size:13px;box-sizing:border-box;outline:none;">';
  }
  function textArea(value) {
    return '<textarea readonly style="width:100%;min-height:50px;border:1px solid #e5e7eb;border-radius:4px;background:#f8f9fb;color:#303133;padding:8px 10px;font-size:13px;box-sizing:border-box;outline:none;resize:none;font-family:inherit;">' + safe(value) + '</textarea>';
  }
  function actualControl() {
    if (!approval) return promotionReadonlyInput('detailActualEndDate', actualEnd);
    return promotionActualEndDateControl('detailActualEndDate', promotionNormalizeDate(actualEnd || expectedEnd), 'detail');
  }
  function field(label, control, required, full) {
    return '<div style="' + (full ? 'grid-column:1/3;' : '') + '"><div style="font-size:13px;color:#111827;font-weight:600;margin-bottom:8px;">' + (required ? '<span style="color:#f5222d;margin-right:2px;">*</span>' : '') + safe(label) + '</div>' + control + '</div>';
  }
  function section(title, body) {
    return '<div style="background:#fff;border-radius:4px;margin-bottom:10px;overflow:hidden;">' +
      '<div style="height:46px;display:flex;align-items:center;border-bottom:1px solid #ebeef5;padding:0 16px;font-size:16px;font-weight:700;color:#111827;"><span style="font-size:11px;color:#111827;margin-right:10px;">▲</span>' + safe(title) + '</div>' + body + '</div>';
  }
  function resultRows() {
    var start = promotionParseDate(startDate) || new Date(2026, 6, 1);
    var end = promotionParseDate(actualEnd || expectedEnd) || new Date(2026, 7, 5);
    var today = new Date(2026, 7, 5);
    if (end > today) end = today;
    var d = new Date(start.getFullYear(), start.getMonth(), 1);
    var last = new Date(end.getFullYear(), end.getMonth(), 1);
    var rows = [];
    var data = promotionPerformanceData[empNo] || {};
    while (d <= last && rows.length < 18) {
      var period = promotionMonthText(d);
      rows.push({ period: period, result: data[period] || '绩效流程未完结' });
      d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
    }
    if (!rows.length) rows.push({ period:'2026年08月', result:'绩效流程未完结' });
    if (rows.length > 1) rows[1].result = '超出预期';
    return rows;
  }
  var employeeSection = promotionCard('员工信息', '<div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;">' +
    promotionField('员工', promotionReadonlyInput('detailPromotionEmp', employeeName), true, false) +
    promotionField('工号', promotionReadonlyInput('detailPromotionEmpNo', empNo), true, false) +
    promotionField('职位', promotionReadonlyInput('detailPromotionPosition', position), true, false) +
    promotionField('职级', promotionReadonlyInput('detailPromotionRank', rank), true, false) +
    promotionField('入职日期', promotionReadonlyInput('detailPromotionEntryDate', entryDate), true, false) +
    promotionField('部门全称', promotionReadonlyInput('detailPromotionDept', dept), true, true) +
  '</div>');
  var promotionSection = promotionCard('晋升信息', '<div style="padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;">' +
    promotionField('业务类型', promotionReadonlyInput('detailPromotionBusinessType', '晋升见习转正'), true, false) +
    promotionField('晋升见习开始日期', promotionReadonlyInput('detailPromotionStartDate', startDate), true, false) +
    promotionField('晋升见习预计结束日期', promotionReadonlyInput('detailPromotionExpectEndDate', expectedEnd), true, false) +
    promotionField('晋升见习实际结束日期', actualControl(), true, false) +
  '</div>');
  var perfRows = resultRows().map(function(row, idx) {
    return '<tr><td style="padding:8px 12px;border:1px solid #e8eaed;text-align:center;vertical-align:middle;">' + (idx + 1) + '</td>' +
      '<td style="padding:8px 12px;border:1px solid #e8eaed;background:#f5f5f5;color:#666;">' + safe(row.period) + '</td>' +
      '<td style="padding:8px 12px;border:1px solid #e8eaed;background:#f5f5f5;">' + renderPromotionResultTag(row.result) + '</td>' +
      '<td style="padding:8px 12px;border:1px solid #e8eaed;text-align:center;color:#999;"></td></tr>';
  }).join('');
  var performanceSection = promotionCard('晋升见习期间绩效考核周期和结果', '<div style="padding:12px;"><table id="detailPerfReviewTable" style="width:100%;border-collapse:collapse;font-size:13px;border:1px solid #e8eaed;"><thead><tr style="background:#f7f8fc;"><th style="padding:8px 12px;text-align:left;border:1px solid #e8eaed;font-weight:500;color:#666;width:50px;">序号</th><th style="padding:8px 12px;text-align:left;border:1px solid #e8eaed;font-weight:500;color:#666;width:30%;"><span style="color:red;">*</span> 考核周期</th><th style="padding:8px 12px;text-align:left;border:1px solid #e8eaed;font-weight:500;color:#666;"><span style="color:red;">*</span> 考核结果</th><th style="padding:8px 12px;text-align:left;border:1px solid #e8eaed;font-weight:500;color:#666;width:70px;">操作</th></tr></thead><tbody>' + perfRows + '</tbody></table></div>');
  var attachmentSection = renderPromotionAttachment();
  function timelineNode(title, name, text, active, extra) {
    return '<div style="position:relative;padding-left:28px;margin-bottom:26px;">' +
      '<span style="position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:' + (active ? '#14c269' : '#fff') + ';border:2px solid ' + (active ? '#14c269' : '#9aa1ad') + ';box-sizing:border-box;"></span>' +
      '<div style="font-size:14px;font-weight:700;color:#111827;margin-bottom:10px;">' + safe(title) + (extra || '') + '</div>' +
      (name ? '<div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#111827;margin-bottom:8px;"><span style="width:24px;height:24px;border-radius:50%;border:1px solid #22c7e8;color:#0E66FB;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:#ecfeff;">黄</span><span>' + safe(name) + '<br><span style="color:#111827;">(' + safe(creatorEmpNo) + ')</span></span><span style="margin-left:auto;color:#8a92a6;font-size:12px;">◷ 2026/07/30 17:00~2026/07/30 17:00</span></div>' : '') +
      '<div style="background:#f6f8fb;border-radius:5px;padding:9px 10px;font-size:13px;color:' + (active ? '#14a35c' : '#606266') + ';line-height:20px;">' + safe(text) + '</div>' +
    '</div>';
  }
  var timeline = '<div style="background:#fff;border-radius:4px;height:100%;overflow:auto;">' +
    '<div style="height:56px;display:flex;align-items:center;border-bottom:1px solid #ebeef5;padding:0 22px;font-size:16px;font-weight:700;color:#111827;"><span style="width:20px;height:20px;border-radius:50%;background:#e8f3ff;color:#0E66FB;display:inline-flex;align-items:center;justify-content:center;margin-right:8px;font-size:13px;">审</span>审批记录</div>' +
    '<div style="position:relative;margin:24px 18px 24px 28px;border-left:1px dashed #14c269;padding-left:0;">' +
      timelineNode('发起人', creator, '提交', true, '') +
      timelineNode('双线上级', '', '自动完成,原因: 审批人为发起人时：自动跳过', true, '') +
      timelineNode('直属上级', creator, '节点干预到HRBP节点对接人: ' + creator + '(' + creatorEmpNo + ')', true, '<span style="float:right;color:#8a92a6;font-weight:400;font-size:12px;">⌛ 1分钟</span>') +
      timelineNode('HRBP', creator, '当前节点待处理', false, '<span style="float:right;color:#8a92a6;font-weight:400;font-size:12px;">⌛ 0秒</span>') +
    '</div></div>';
  var actionButtons = approval ? '<div style="display:flex;align-items:center;gap:8px;">' +
    '<button style="height:32px;background:#0E66FB;color:#fff;border:none;border-radius:5px;padding:0 14px;font-size:13px;cursor:pointer;">◎ 同意</button>' +
    '<button style="height:32px;background:#fff;color:#ff4d4f;border:1px solid #ffccc7;border-radius:5px;padding:0 14px;font-size:13px;cursor:pointer;">⊘ 不同意</button>' +
    '<button style="height:32px;background:#fff;color:#0E66FB;border:1px solid #91caff;border-radius:5px;padding:0 14px;font-size:13px;cursor:pointer;">⊙ 驳回到发起人</button>' +
    '<div style="position:relative;" onmouseenter="this.lastElementChild.style.display=\'block\'" onmouseleave="this.lastElementChild.style.display=\'none\'"><button title="更多操作" style="width:34px;height:32px;background:#fff;color:#0E66FB;border:1px solid #91caff;border-radius:5px;font-size:18px;cursor:pointer;line-height:24px;">⋮</button><div style="display:none;position:absolute;right:0;top:36px;width:126px;background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:6px 0;z-index:5;font-size:13px;color:#303133;"><div style="padding:8px 14px;">驳回到上一步</div><div style="padding:8px 14px;">驳回到历史节点</div><div style="padding:8px 14px;">转交</div><div style="padding:8px 14px;">查看流程图</div></div></div>' +
  '</div>' : '';
  return '<div class="promotion-approval-detail-page" style="height:100%;display:flex;flex-direction:column;background:#f5f6fa;overflow:hidden;">' +
    '<div style="background:#fff;border-bottom:1px solid #e8eaed;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.02);">' +
      '<div style="display:flex;align-items:center;gap:16px;min-width:0;"><div style="width:52px;height:52px;border:2px solid #22c7e8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#11bfbf;font-size:18px;font-weight:700;background:#ecfeff;flex-shrink:0;">' + safe(employeeName.slice(0,1)) + '</div><div style="min-width:0;"><div style="font-size:20px;font-weight:700;color:#111827;line-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + safe(displayTitle) + ' <span style="font-size:12px;font-weight:500;color:#0E66FB;background:#e8f3ff;border:1px solid #91caff;border-radius:4px;padding:2px 7px;vertical-align:middle;">审批中</span></div><div style="margin-top:8px;font-size:12px;color:#606266;display:flex;gap:14px;align-items:center;"><span>♙ 审批编号：' + safe(approvalNo) + '</span><span>♙ 发起人：' + safe(creator) + '(' + safe(creatorEmpNo) + ')</span><span>◷ 发起日期：' + safe(applyDate) + '</span></div></div></div>' + actionButtons +
    '</div>' +
    '<div style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:10px;overflow:hidden;padding-top:10px;">' +
      '<div style="overflow:auto;padding:6px 12px 14px 12px;">' + employeeSection + promotionSection + performanceSection + attachmentSection + '</div>' +
      '<div style="overflow:hidden;padding-right:6px;">' + timeline + '</div>' +
    '</div></div>';
}
function ensurePromotionPatchStyle(){ if(document.getElementById('promotionPatchStyle'))return; var st=document.createElement('style'); st.id='promotionPatchStyle'; st.textContent='@keyframes promoSpin{to{transform:rotate(360deg)}}.team-profile-table td,.tpp-table td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-profile-table .col-op,.tpp-table .col-op{overflow:visible;text-overflow:clip}'; document.head.appendChild(st); }
document.addEventListener('DOMContentLoaded', ensurePromotionPatchStyle);

// Render everything
renderAllMenuDropdown();
renderSidebar();
renderTabs();
renderContent();

</script>
